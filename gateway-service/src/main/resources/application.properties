server.port=9000
spring.application.name=gateway-service
spring.cloud.compatibility-verifier.enabled=false

# HashiCorp Vault Integration
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:my-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.config.lifecycle.enabled=true

# --- Gateway Routing Configuration ---
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**, /auth/**, /login/**, /oauth2/**

spring.cloud.gateway.server.webflux.routes[1].id=payment-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PAYMENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/payments/**, /subscriptions/**

spring.cloud.gateway.server.webflux.routes[2].id=ivr-service
spring.cloud.gateway.server.webflux.routes[2].uri=${IVR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ivr/**

# Ruta para WebSockets del IVR (Dashboard en tiempo real)
spring.cloud.gateway.server.webflux.routes[3].id=ivr-ws
spring.cloud.gateway.server.webflux.routes[3].uri=${IVR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ws/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications/**

# --- CORS Configuration at Gateway level ---
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Logging for easier debugging
logging.level.org.springframework.cloud.gateway=TRACE

# Actuator & Prometheus Monitoring Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
