apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: voicepay
  labels:
    app: gateway-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: localhost/voicepay/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: voicepay-configmap
                  key: USER_SERVICE_URL_BASE
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: voicepay-configmap
                  key: PAYMENT_SERVICE_URL_BASE
            - name: IVR_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: voicepay-configmap
                  key: IVR_SERVICE_URL_BASE
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: voicepay-configmap
                  key: NOTIFICATION_SERVICE_URL_BASE
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: voicepay-configmap
                  key: LOGSTASH_HOST
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: voicepay
  labels:
    app: gateway-service
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: http
  selector:
    app: gateway-service
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service-hpa
  namespace: voicepay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
