apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voicepay-ingress
  namespace: voicepay
  annotations:
    kubernetes.io/ingress.class: contour
spec:
  ingressClassName: contour
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 9000
