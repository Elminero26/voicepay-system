version: '3.8'

services:
  # --- Database ---
  voicepay-postgres:
    image: postgres:16-alpine
    container_name: voicepay-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ToPo12345@
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicepay-network

  # --- Secret Management (HashiCorp Vault) ---
  voicepay-vault:
    image: hashicorp/vault:1.15
    container_name: voicepay-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=my-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - voicepay-network

  voicepay-vault-init:
    image: hashicorp/vault:1.15
    container_name: voicepay-vault-init
    environment:
      - VAULT_ADDR=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    entrypoint: >
      sh -c "
      sleep 2;
      vault kv put secret/user-service app.encryption-key=v0ic3P4yS3cur3Key2026Encryption! jwt.secret=MySuperSecretKeyForVoicePayMicroservicesShouldBeVeryLongAndSecure google.client-secret=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 microsoft.client-secret=YOUR_MICROSOFT_CLIENT_SECRET spring.datasource.password=ToPo12345@;
      vault kv put secret/payment-service app.encryption-key=v0ic3P4yS3cur3Key2026Encryption! jwt.secret=MySuperSecretKeyForVoicePayMicroservicesShouldBeVeryLongAndSecure spring.datasource.password=ToPo12345@;
      vault kv put secret/ivr-service jwt.secret=MySuperSecretKeyForVoicePayMicroservicesShouldBeVeryLongAndSecure spring.datasource.password=ToPo12345@ twilio.auth-token=TOKEN_PLACEHOLDER;
      vault kv put secret/notification-service jwt.secret=MySuperSecretKeyForVoicePayMicroservicesShouldBeVeryLongAndSecure spring.datasource.password=ToPo12345@ twilio.account-sid=AC_PLACEHOLDER twilio.auth-token=TOKEN_PLACEHOLDER twilio.phone-number=+10000000000 twilio.whatsapp-number=+10000000000 twilio.whatsapp-enabled=false;
      vault kv put secret/gateway-service jwt.secret=MySuperSecretKeyForVoicePayMicroservicesShouldBeVeryLongAndSecure;
      echo 'Vault initialization complete';
      "
    depends_on:
      voicepay-vault:
        condition: service_healthy
    networks:
      - voicepay-network

  # --- Microservices ---
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: voicepay-user-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://voicepay-postgres:5432/voicepay_user
      - SPRING_DATASOURCE_USERNAME=postgres
      - LOGSTASH_HOST=logstash
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - VAULT_URI=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    depends_on:
      voicepay-postgres:
        condition: service_healthy
      voicepay-vault:
        condition: service_healthy
    networks:
      - voicepay-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: voicepay-payment-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://voicepay-postgres:5432/voicepay_payment
      - SPRING_DATASOURCE_USERNAME=postgres
      - USER_SERVICE_URL=http://user-service:8080/users
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083/notifications
      - LOGSTASH_HOST=logstash
      - VAULT_URI=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    depends_on:
      voicepay-postgres:
        condition: service_healthy
      voicepay-vault:
        condition: service_healthy
      user-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - voicepay-network

  ivr-service:
    build:
      context: .
      dockerfile: ivr-service/Dockerfile
    container_name: voicepay-ivr-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://voicepay-postgres:5432/voicepay_ivr
      - SPRING_DATASOURCE_USERNAME=postgres
      - USER_SERVICE_URL=http://user-service:8080/users
      - PAYMENT_SERVICE_URL=http://payment-service:8081/payments
      - LOGSTASH_HOST=logstash
      - VAULT_URI=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    depends_on:
      voicepay-postgres:
        condition: service_healthy
      voicepay-vault:
        condition: service_healthy
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - voicepay-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: voicepay-notification-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://voicepay-postgres:5432/voicepay_notification
      - SPRING_DATASOURCE_USERNAME=postgres
      - LOGSTASH_HOST=logstash
      - VAULT_URI=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    depends_on:
      voicepay-postgres:
        condition: service_healthy
      voicepay-vault:
        condition: service_healthy
    networks:
      - voicepay-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: voicepay-gateway-service
    ports:
      - "9000:9000"
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - PAYMENT_SERVICE_URL=http://payment-service:8081
      - IVR_SERVICE_URL=http://ivr-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - LOGSTASH_HOST=logstash
      - VAULT_URI=http://voicepay-vault:8200
      - VAULT_TOKEN=my-root-token
    depends_on:
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      ivr-service:
        condition: service_started
      notification-service:
        condition: service_started
      voicepay-vault:
        condition: service_healthy
    networks:
      - voicepay-network

  # --- Infrastructure & Monitoring ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: voicepay-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - voicepay-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: voicepay-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch
    networks:
      - voicepay-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: voicepay-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - voicepay-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: voicepay-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - voicepay-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: voicepay-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - voicepay-network

volumes:
  elasticsearch-data:
    driver: local
  postgres-data:
    driver: local

networks:
  voicepay-network:
    driver: bridge
