input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # If the log message contains a JSON string, we can parse it
  # But typically logstash-logback-encoder will already structure it.
  
  # Ensure we have a timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "voicepay-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
