server.port=8083
spring.application.name=notification-service

# HashiCorp Vault Integration
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:my-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.config.lifecycle.enabled=true

# Database Configuration (H2 for simplicity)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voicepay_notification}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ToPo12345@}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad - API Key para comunicación entre servicios

# Logging
logging.level.com.voicepay.notification=DEBUG

# Actuator & Prometheus Monitoring Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Springdoc OpenAPI path mapping
springdoc.api-docs.path=/notifications/v3/api-docs

# Twilio Properties
twilio.account-sid=${TWILIO_ACCOUNT_SID:AC_PLACEHOLDER}
twilio.auth-token=${TWILIO_AUTH_TOKEN:TOKEN_PLACEHOLDER}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+10000000000}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:+10000000000}
twilio.whatsapp-enabled=${TWILIO_WHATSAPP_ENABLED:false}


