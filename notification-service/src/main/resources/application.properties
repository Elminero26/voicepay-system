server.port=8083
spring.application.name=notification-service

# Database Configuration (H2 for simplicity)
spring.datasource.url=jdbc:postgresql://localhost:5432/voicepay_notification
spring.datasource.username=postgres
spring.datasource.password=ToPo12345@
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad - API Key para comunicación entre servicios

# Logging
logging.level.com.voicepay.notification=DEBUG

# Actuator & Prometheus Monitoring Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
