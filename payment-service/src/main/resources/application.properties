server.port=8081
spring.application.name=payment-service

# HashiCorp Vault Integration
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:my-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.config.lifecycle.enabled=true

# Database Configuration (Cambiado a PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voicepay_payment}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ToPo12345@}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Service Communication
app.user-service.url=${USER_SERVICE_URL:http://localhost:8080/users}
app.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083/notifications}

# Encryption
app.encryption-key=${APP_ENCRYPTION_KEY:v0ic3P4yS3cur3Key2026Encryption!}

# Resilience4j - Circuit Breaker Config
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.notificationService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j - Retry Config
resilience4j.retry.instances.userService.maxAttempts=3
resilience4j.retry.instances.userService.waitDuration=2s
resilience4j.retry.instances.userService.enableExponentialBackoff=true
resilience4j.retry.instances.userService.exponentialBackoffMultiplier=2

resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=2s
resilience4j.retry.instances.notificationService.enableExponentialBackoff=true
resilience4j.retry.instances.notificationService.exponentialBackoffMultiplier=2

# Resilience4j - Time Limiter Config
resilience4j.timelimiter.instances.userService.timeoutDuration=3s
resilience4j.timelimiter.instances.notificationService.timeoutDuration=3s

# Spring Boot Actuator & Resilience4j health/prometheus exposure
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.prometheus.metrics.export.enabled=true

# Springdoc OpenAPI path mapping
springdoc.api-docs.path=/payments/v3/api-docs


