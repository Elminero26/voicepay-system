server.port=8082
spring.application.name=ivr-service

# Service Communication URLs
app.user-service.url=http://localhost:8080/users
app.payment-service.url=http://localhost:8081/payments

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/voicepay_ivr
spring.datasource.username=postgres
spring.datasource.password=ToPo12345@
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Twilio Configuration (Configura estas variables en tu entorno local)
twilio.account-sid=${TWILIO_ACCOUNT_SID:AC_PLACEHOLDER}
twilio.auth-token=${TWILIO_AUTH_TOKEN:TOKEN_PLACEHOLDER}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+10000000000}
twilio.webhook-url=${TWILIO_WEBHOOK_URL:http://localhost:8082}


# Seguridad - API Key para hablar con otros servicios

# Resilience4j - Circuit Breaker Config
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.paymentService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j - Retry Config
resilience4j.retry.instances.userService.maxAttempts=3
resilience4j.retry.instances.userService.waitDuration=2s
resilience4j.retry.instances.userService.enableExponentialBackoff=true
resilience4j.retry.instances.userService.exponentialBackoffMultiplier=2

resilience4j.retry.instances.paymentService.maxAttempts=3
resilience4j.retry.instances.paymentService.waitDuration=2s
resilience4j.retry.instances.paymentService.enableExponentialBackoff=true
resilience4j.retry.instances.paymentService.exponentialBackoffMultiplier=2

# Resilience4j - Time Limiter Config
resilience4j.timelimiter.instances.userService.timeoutDuration=3s
resilience4j.timelimiter.instances.paymentService.timeoutDuration=3s

# Spring Boot Actuator & Resilience4j health/prometheus exposure
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.metrics.export.prometheus.enabled=true

